name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./refactored/LegacyShop.Api/LegacyShop.Api.csproj

      - name: Build
        run: dotnet build ./refactored/LegacyShop.Api/LegacyShop.Api.csproj --no-restore

      - name: Test
        run: dotnet test ./tests/LegacyShop.Api.Tests/LegacyShop.Api.Tests.csproj --no-restore --verbosity normal